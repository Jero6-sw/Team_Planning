name: build-odt
on:
  push:
    paths:
      - "Documents/odt-src/**"
      - ".github/workflows/build-odt.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4
      - name: Assemblage du fichier ODT
        run: |
          cd Documents/odt-src
          rm -f "../Guide_installation_et_utilisation.odt"
          zip -X -0 "../Guide_installation_et_utilisation.odt" mimetype
          zip -X -9 "../Guide_installation_et_utilisation.odt" META-INF/manifest.xml content.xml styles.xml meta.xml
      - name: Publication du fichier ODT
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Documents/Guide_installation_et_utilisation.odt"
          git commit -m "build: regeneration du guide ODT" || echo "aucun changement"
          git push
