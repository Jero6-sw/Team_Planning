name: build-assets
# Regeneration automatique : module VBA ANSI (Windows-1252, CRLF) et guide ODT,
# reconstruits a chaque modification des sources surveillees ci-dessous.
on:
  push:
    paths:
      - "Sources/PlanningEquie_UTF8.bas"
      - "Documents/odt-src/**"
      - ".github/workflows/build-assets.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4
      - name: Module VBA en ANSI (Windows-1252) et fins de ligne CRLF
        run: |
          iconv -f UTF-8 -t WINDOWS-1252 "Sources/PlanningEquie_UTF8.bas" | awk '{ sub(/$/, "\r"); print }' > "Sources/PlanningEquie.bas"
      - name: Assemblage du fichier ODT
        run: |
          cd Documents/odt-src
          rm -f "../Guide_installation_et_utilisation.odt"
          zip -X -0 "../Guide_installation_et_utilisation.odt" mimetype
          zip -X -9 "../Guide_installation_et_utilisation.odt" META-INF/manifest.xml content.xml styles.xml meta.xml
      - name: Publication des fichiers generes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "Sources/PlanningEquie.bas" "Documents/Guide_installation_et_utilisation.odt"
          git commit -m "build: regeneration du module VBA ANSI et du guide ODT" || echo "aucun changement"
          git push
